name: Actualizar mapa

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Notion y generar datos
        run: python update_map.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROPERTY_NAME: Lugar

      - name: Guardar cambios
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add docs geocache.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar mapa"
            git push
          fi
