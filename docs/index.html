<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de lugares</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #info { position: absolute; z-index: 1000; left: 10px; bottom: 10px; background: rgba(255,255,255,.92);
          padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .popup-title { font-weight: 600; margin-bottom: 2px; }
  .popup-meta { color: #666; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info">Cargando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const COLORS = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#475569","#ea580c"];
const map = L.map("map").setView([40.4, -3.7], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; colaboradores de OpenStreetMap"
}).addTo(map);

fetch("data.json?t=" + Date.now()).then(r => r.json()).then(data => {
  const groups = {};
  const colorOf = {};
  const bounds = [];
  data.points.forEach(p => {
    if (!groups[p.db]) {
      groups[p.db] = L.layerGroup().addTo(map);
      colorOf[p.db] = COLORS[Object.keys(colorOf).length % COLORS.length];
    }
    const m = L.circleMarker([p.lat, p.lon], {
      radius: 8, color: "#fff", weight: 2, fillColor: colorOf[p.db], fillOpacity: 0.9
    });
    const box = document.createElement("div");
    const t = document.createElement("div"); t.className = "popup-title";
    if (p.url) { const a = document.createElement("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = p.title; t.appendChild(a); }
    else t.textContent = p.title;
    const meta = document.createElement("div"); meta.className = "popup-meta";
    meta.textContent = p.db + (p.place ? " · " + p.place : "");
    box.append(t, meta);
    m.bindPopup(box).addTo(groups[p.db]);
    bounds.push([p.lat, p.lon]);
  });
  const overlays = {};
  Object.keys(groups).forEach(db => {
    overlays[`<span style="color:${colorOf[db]}">●</span> ` + db.replace(/</g, "&lt;")] = groups[db];
  });
  if (Object.keys(overlays).length) L.control.layers(null, overlays, { collapsed: false }).addTo(map);
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  const d = new Date(data.updated);
  document.getElementById("info").textContent =
    `${data.points.length} lugares · actualizado ${d.toLocaleString("es-ES")}` +
    (data.unresolved ? ` · ${data.unresolved} sin localizar` : "");
}).catch(() => { document.getElementById("info").textContent = "No se pudo cargar data.json"; });
</script>
</body>
</html>
